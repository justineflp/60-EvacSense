# EvacSense Application Properties
server.port=${PORT:5000}

# Supabase PostgreSQL Database Connection
supabase.db.url=postgresql://postgres.xbnifponmrbcjvsqlmyf:Evacsense!60@aws-1-ap-northeast-1.pooler.supabase.com:5432/postgres

# JPA and Hibernate Configuration
# Use 'validate' instead of 'update' to prevent Hibernate from opening
# a raw DDL connection that bypasses HikariCP and exhausts PgBouncer's session pool
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.globally_quoted_identifiers=true

# HikariCP connection pool tuning for Supabase PgBouncer (session mode, pool_size: 15)
spring.datasource.hikari.maximum-pool-size=3
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=600000
spring.datasource.hikari.keepalive-time=60000

# PgBouncer compatibility: disable prepared statements
spring.datasource.hikari.data-source-properties.prepareThreshold=0

# Keep connection open for SseEmitters
spring.mvc.async.request-timeout=-1

